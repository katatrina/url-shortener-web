<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloudscape Visual Refresh</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--color-background-layout-main); color:var(--color-text-heading-default); font-family:var(--font-base); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .band { position:absolute; left:0; top:0; width:960px; height:136px; }
  .band svg { display:block; width:960px; height:136px; }
  .deep { fill:var(--color-text-heading-default); }
  .brand { fill:var(--color-background-button-primary-default); }
  .tint { fill:var(--color-border-divider-default); }
  .signal { fill:var(--color-background-flashbar-success); }
  .cut { fill:var(--color-background-layout-main); }
  .blk { rx:var(--border-radius-container); }
  .words { position:absolute; left:var(--space-static-xl); right:var(--space-static-xl); bottom:var(--space-static-xl); }
  .name { margin:0; font-size:60px; line-height:.95; font-weight:700; letter-spacing:-0.03em; color:var(--color-text-heading-default); white-space:nowrap; }
  .tag { margin:var(--space-static-xs) 0 0 2px; font-size:14px; line-height:20px; color:var(--color-text-body-secondary); max-width:440px; }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 136" width="960" height="136">
<!--
  blocks      deep (color-text-heading-default, the dark top-navigation bar) 288×96 · brand (color-background-button-primary-default) 320×96, the largest · tint (color-border-divider-default, the hairline every container wears) 176×96 · signal (color-background-flashbar-success) one 80×32 pill only — ≈30% of 960×288
  arrangement top-band skeleton (the name is too wide for the 440px zone): a flush strip of unequal blocks read as the console's own top bar, space-static-m gutters, inset space-static-xl
  pattern     pills from border-radius-button (20px, the refresh's signature rounded buttons): button-height pills cut into the ink and brand blocks in the ground colour, a stacked pair of pills beside the tint — like the button rows in every header
  scales      sides in space-static-m multiples; gutters space-static-m; corners border-radius-container (16px); pills height 32 (size-vertical-input), rx 16 (half the short side)
-->
<rect class="deep blk" x="24" y="24" width="288" height="96" rx="16"/>
<rect class="cut" x="48" y="48" width="96" height="16" rx="8"/>
<rect class="cut" x="216" y="48" width="32" height="16" rx="8"/>
<rect class="cut" x="256" y="48" width="32" height="16" rx="8"/>
<rect class="cut" x="48" y="80" width="208" height="16" rx="8"/>
<rect class="brand blk" x="328" y="24" width="320" height="96" rx="16"/>
<rect class="cut" x="352" y="64" width="128" height="32" rx="16"/>
<rect class="cut" x="496" y="64" width="128" height="32" rx="16"/>
<rect class="tint blk" x="664" y="24" width="176" height="96" rx="16"/>
<rect class="brand" x="856" y="24" width="80" height="32" rx="16"/>
<rect class="signal" x="856" y="88" width="80" height="32" rx="16"/>
</svg>
</div>
<div class="words">
<h1 class="name">Cloudscape Visual Refresh</h1>
<p class="tag">Dense, calm and familiar: the console look for a Vue frontend.</p>
</div>
</div>
</body>
</html>
