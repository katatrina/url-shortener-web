<!-- @dsCard group="Status" height=300 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert — preview</title></head>
<body>
<div class="cs-demo-col" style="max-width:640px">
  <div class="cs-alert" role="status"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="M8 12V7M8 6V4"></path></svg></span><div class="cs-alert__body"><div class="cs-alert__header">Maintenance window</div>Your database will restart on Sunday at 02:00 UTC.</div></div>
  <div class="cs-alert cs-alert--success" role="status"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="M4.5 7.5 7 10l4-5" stroke-linejoin="round"></path></svg></span><div class="cs-alert__body">Backup policy saved.</div></div>
  <div class="cs-alert cs-alert--warning" role="status"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v4M8 10v2M6.52 1.88l-5.33 9.76c-.13.23-.19.5-.19.76 0 .88.71 1.59 1.59 1.59H13.4c.88 0 1.59-.71 1.59-1.59 0-.27-.07-.53-.19-.76L9.48 1.88C9.18 1.34 8.62 1 8 1s-1.18.34-1.48.88Z" stroke-linejoin="round"></path></svg></span><div class="cs-alert__body">This key will expire in 7 days.</div><button class="cs-btn cs-alert__action" type="button">Rotate key</button></div>
  <div class="cs-alert cs-alert--error" role="alert"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="m5.5 5.5 5 5M10.5 5.5l-5 5"></path></svg></span><div class="cs-alert__body"><div class="cs-alert__header">Couldn't delete bucket</div>The bucket is not empty.</div></div>
</div>
</body>
</html>
