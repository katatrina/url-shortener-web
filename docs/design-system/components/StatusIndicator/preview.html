<!-- @dsCard group="Status" height=110 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusIndicator — preview</title></head>
<body>
<div class="cs-demo">
  <span class="cs-status cs-status--success"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="M4.5 7.5 7 10l4-5" stroke-linejoin="round"></path></svg></span><span class="cs-status__text">Available</span></span>
  <span class="cs-status cs-status--error"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="m5.5 5.5 5 5M10.5 5.5l-5 5"></path></svg></span><span class="cs-status__text">Failed</span></span>
  <span class="cs-status cs-status--warning"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v4M8 10v2M6.52 1.88l-5.33 9.76c-.13.23-.19.5-.19.76 0 .88.71 1.59 1.59 1.59H13.4c.88 0 1.59-.71 1.59-1.59 0-.27-.07-.53-.19-.76L9.48 1.88C9.18 1.34 8.62 1 8 1s-1.18.34-1.48.88Z" stroke-linejoin="round"></path></svg></span><span class="cs-status__text">Impaired</span></span>
  <span class="cs-status cs-status--info"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="M8 12V7M8 6V4"></path></svg></span><span class="cs-status__text">Updating</span></span>
  <span class="cs-status cs-status--in-progress"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="M9 7H7v2h2V7ZM6 7H4v2h2V7ZM12 7h-2v2h2V7Z" fill="currentColor" stroke="none"></path></svg></span><span class="cs-status__text">In progress</span></span>
  <span class="cs-status cs-status--pending"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="M8 4v5H4" stroke-linejoin="round"></path></svg></span><span class="cs-status__text">Pending</span></span>
  <span class="cs-status cs-status--stopped"><span class="cs-icon"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7"></circle><path d="M5 8h6"></path></svg></span><span class="cs-status__text">Stopped</span></span>
</div>
</body>
</html>
