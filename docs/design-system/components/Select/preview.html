<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body>
<div class="cs-demo-col">
  <div class="cs-select">
    <button class="cs-select__trigger" type="button" aria-haspopup="listbox" aria-expanded="true"><span>t3.medium</span><span class="cs-icon cs-select__caret"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="m8 11 4-6H4l4 6Z" fill="currentColor" stroke-linejoin="round"></path></svg></span></button>
    <ul class="cs-dropdown" role="listbox" style="position:static;margin-top:4px">
      <li class="cs-option" role="option"><span>t3.micro<div class="cs-option__secondary">2 vCPU · 1 GiB</div></span></li>
      <li class="cs-option" role="option" aria-selected="true"><span>t3.medium<div class="cs-option__secondary">2 vCPU · 4 GiB</div></span><span class="cs-icon cs-icon--check"><svg aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="m1 9 4 4L15 2" stroke-linejoin="round"></path></svg></span></li>
      <li class="cs-option is-highlighted" role="option"><span>t3.large<div class="cs-option__secondary">2 vCPU · 8 GiB</div></span></li>
      <li class="cs-option" role="option" aria-disabled="true"><span>t3.xlarge<div class="cs-option__secondary">Not available in this zone</div></span></li>
    </ul>
  </div>
</div>
</body>
</html>
